<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jolley Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="home">
  <main class="home-wrap">
    <div class="brand"><span>Jolley</span> Search</div>
    <p class="tagline">Search the web. Fast, simple, independent.</p>
    <form class="search-form" action="/search" method="get">
      <input name="q" type="search" maxlength="300" autofocus autocomplete="off" placeholder="Search the web..." aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <p class="note">Jolley Search V1 · Powered by an independent web search provider</p>
  </main>
</body>
</html>
